---
- name: Force delete any corrupt or fake archives from tmp cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "/tmp/node_exporter-1.8.2.linux-amd64.tar.gz"
    - "/tmp/node_exporter-1.8.2.linux-amd64"

- name: Create dedicated system group for Node Exporter
  ansible.builtin.group:
    name: node_exporter
    state: present
    system: yes

- name: Create dedicated system user for Node Exporter
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    shell: /sbin/nologin
    system: yes
    create_home: no
    state: present

# FIXED: Yeh perfect official software download link hai jo real package stream fetch karega
- name: Download Prometheus Node Exporter binary bundle securely via curl
  ansible.builtin.shell: |
    curl -sSL "https://github.com" -o /tmp/node_exporter-1.8.2.linux-amd64.tar.gz

- name: Extract Node Exporter binary payload safely via native tar tool
  ansible.builtin.shell: |
    tar -xzf /tmp/node_exporter-1.8.2.linux-amd64.tar.gz -C /tmp/
  args:
    creates: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter

- name: Copy Node Exporter binary payload to system path
  ansible.builtin.copy:
    src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    owner: node_exporter
    group: node_exporter
    remote_src: yes

- name: Setup Systemd engine controller config for Node Exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter Daemon
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Reload systemd configuration map and start service execution
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: yes
    daemon_reload: yes
