---
- name: Automate Infrastructure Prometheus and Grafana Stack Installation
  hosts: webserver
  become: yes
  tasks:
    - name: Construct central monitoring environment directory
      file:
        path: /home/ubuntu/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Generate static Prometheus collection configuration map
      copy:
        dest: /home/ubuntu/monitoring/prometheus.yml
        content: |
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: 'node_exporter_metrics'
              static_configs:
                - targets: ['98.81.119.245:9100', '54.164.38.20:9100']
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Generate multi container deployment manifest map
      copy:
        dest: /home/ubuntu/monitoring/docker-compose.yml
        content: |
          version: '3.8'
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: pipeline-prometheus-engine
              volumes:
                - /home/ubuntu/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
              ports:
                - "9090:9090"
              networks:
                - monitoring-network
              restart: always
            grafana:
              image: grafana/grafana:latest
              container_name: pipeline-grafana-engine
              ports:
                - "3000:3000"
              networks:
                - monitoring-network
              restart: always

          networks:
            monitoring-network:
              driver: bridge
