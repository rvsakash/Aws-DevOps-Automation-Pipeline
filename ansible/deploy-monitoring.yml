---
- name: Automate Centralized Prometheus and Grafana Stack on Selected Web Server
  hosts: aws_ec2 # Targets remote EC2 nodes where Docker works perfectly
  become: yes
  gather_facts: yes
  tasks:
    - name: Construct central monitoring environment directory on Target
      ansible.builtin.file:
        path: "/home/ubuntu/monitoring"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Generate DYNAMIC Prometheus collection configuration map
      ansible.builtin.copy:
        dest: "/home/ubuntu/monitoring/prometheus.yml"
        content: |
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: 'node_exporter_metrics'
              static_configs:
                - targets: [ {% for host in groups['aws_ec2'] %}'{{ host }}:9100'{% if not loop.last %}, {% endif %}{% endfor %} ]
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Generate multi container deployment manifest map with Auto-Provisioning
      ansible.builtin.copy:
        dest: "/home/ubuntu/monitoring/docker-compose.yml"
        content: |
          version: '3.8'
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: pipeline-prometheus-engine
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
              volumes:
                - /home/ubuntu/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
              ports:
                - "9090:9090"
              networks:
                - monitoring-network
              restart: always

            grafana:
              image: grafana/grafana:latest
              container_name: pipeline-grafana-engine
              ports:
                - "3000:3000"
              networks:
                - monitoring-network
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=admin
              volumes:
                - grafana-storage:/var/lib/grafana
              restart: always

          networks:
            monitoring-network:
              driver: bridge

          volumes:
            grafana-storage:
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Launch Centralized Monitoring Stack via Native Docker Compose
      ansible.builtin.shell: |
        docker compose down --remove-orphans
        docker compose up -d
      args:
        chdir: "/home/ubuntu/monitoring"

    - name: Wait 15 seconds for Grafana API Engine to stabilize
      ansible.builtin.pause:
        seconds: 15

    - name: AUTOMATE GRAFANA - Inject Prometheus Data Source via API
      ansible.builtin.uri:
        url: "http://localhost:3000/api/datasources"
        method: POST
        user: "admin"
        password: "admin"
        force_basic_auth: yes
        status_code: [200, 409]
        body_format: json
        body:
          name: "Prometheus"
          type: "prometheus"
          access: "proxy"
          url: "http://pipeline-prometheus-engine:9090"
          isDefault: true

    - name: AUTOMATE GRAFANA - Inject Pre-Configured Node Exporter Dashboard
      ansible.builtin.uri:
        url: "http://localhost:3000/api/dashboards/import"
        method: POST
        user: "admin"
        password: "admin"
        force_basic_auth: yes
        status_code: [200, 409]
        body_format: json
        body:
          dashboard:
            id: null
            title: "Linux Node Exporter Full Automation"
            tags: ["templated"]
            timezone: "browser"
            schemaVersion: 16
            version: 1
            refresh: "5s"
          inputs:
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "Prometheus"
