---
- name: Automate Infrastructure Prometheus and Grafana Stack Installation
  hosts: aws_ec2  # FIXED: Matched with dynamic inventory naming convention
  become: yes
  tasks:
    - name: Construct central monitoring environment directory
      ansible.builtin.file:
        path: /home/ubuntu/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Generate DYNAMIC Prometheus collection configuration map
      ansible.builtin.copy:
        dest: /home/ubuntu/monitoring/prometheus.yml
        content: |
          global:
            scrape_interval: 5s
          scrape_configs:
            - job_name: 'node_exporter_metrics'
              static_configs:
                - targets: [ {% for host in groups['aws_ec2'] %}'{{ host }}:9100'{% if not loop.last %}, {% endif %}{% endfor %} ]
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Generate multi container deployment manifest map
      ansible.builtin.copy:
        dest: /home/ubuntu/monitoring/docker-compose.yml
        content: |
          version: '3.8'
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: pipeline-prometheus-engine
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
              volumes:
                - /home/ubuntu/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
              ports:
                - "9090:9090"
              networks:
                - monitoring-network
              restart: always
            grafana:
              image: grafana/grafana:latest
              container_name: pipeline-grafana-engine
              ports:
                - "3000:3000"
              networks:
                - monitoring-network
              restart: always

          networks:
            monitoring-network:
              driver: bridge
